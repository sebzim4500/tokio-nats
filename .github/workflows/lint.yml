name: Lint

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: rustfmt,clippy
          cache-key: ${{ hashFiles('flake.lock') }}

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Enter Nix dev shell
        uses: nicknovitski/nix-develop@v1.2.1

      - name: Check formatting and run Clippy
        run: just check

  audit:
    name: Audit
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1

      - name: Install cargo-deny and Just
        uses: taiki-e/install-action@v2.89.1
        with:
          tool: cargo-deny,just

      - name: Check security advisories
        run: just check-advisories

  zizmor:
    name: GitHub Actions Security
    runs-on: ubuntu-slim

    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check GitHub Actions security
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: false
          annotations: true
