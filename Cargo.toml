[package]
name = "tokio-nats"
version = "0.5.0"
authors = ["Sebastian Zimmer <sebastian.zim@googlemail.com>", "Rob Ede <robjtede@icloud.com>"]
edition = "2024"
rust-version = "1.95"
license = "LGPL-3.0"
description = "Async NATS client"
repository = "https://github.com/x52dev/tokio-nats"

[features]
default = []
aws-lc-rs = ["tokio-rustls/aws_lc_rs"]
ring = ["tokio-rustls/ring"]

[dependencies]
bytes = "1.2.1"
derive_builder = "0.20.1"
futures-util = { version = "0.3.1", default-features = false, features = ["sink"] }
impl-more = "0.3.8"
log = "0.4.14"
memchr = "2.4"
parking_lot = "0.13"
rustls-webpki = "0.103.16"
serde = { version = "1.0.113", features = ["derive"] }
serde_json = "1.0.41"
tokio = { version = "1.21", features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.0", default-features = false, features = ["logging", "tls12"] }
tokio-util = { version = "0.7.4", features = ["codec"] }

[dev-dependencies]
tokio = { version = "1.21", features = ["rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
