[package]
name = "tokio-nats"
version = "0.4.2"
authors = [
    "Sebastian Zimmer <sebastian.zim@googlemail.com>",
    "Rob Ede <robjtede@icloud.com>",
]
edition = "2021"
license = "LGPL-3.0"
description = "Async NATS client"
repository = "https://github.com/x52dev/tokio-nats"

[features]
default = []
aws-lc-rs = ["tokio-rustls/aws_lc_rs"]
ring = ["tokio-rustls/ring"]

[dependencies]
tokio = { version = "1.4", features = ["full"] }
tokio-util = { version = "0.7.4", features = ["codec"] }
bytes = "1.2.1"
serde_json = "1.0.41"
serde = { version = "1.0.102", features = ["derive"] }
futures-util = { version = "0.3.1", features = ["sink", "async-await"] }
memchr = "2.4"
parking_lot = "0.13"
derive_builder = "0.20.1"
log = "0.4"
tokio-rustls = { version = "0.26.0", default-features = false, features = ["logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-webpki = "0.103.16"
impl-more = "0.3.8"

[dev-dependencies]
env_logger = "0.11.5"
pretty_env_logger = "0.5.0"
